<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ByteWise Voice: private, unlimited AI voice studio">
  <style>
    /* Waveform "speaks": each bar breathes, with a delay that travels left to right */
    .bar {
      transform-box: fill-box;
      transform-origin: center;
      animation: speak 1.8s ease-in-out infinite;
    }
    @keyframes speak {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.3); }
    }
    /* Soft pulse on the glow behind the waveform */
    .glow { animation: glow 3.6s ease-in-out infinite; }
    @keyframes glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    /* Respect people who turn off animations in their system settings */
    @media (prefers-reduced-motion: reduce) {
      .bar, .glow { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1A1440"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="waveText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glowFill" cx="0.5" cy="0.8" r="0.6">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect class="glow" width="1280" height="400" rx="24" fill="url(#glowFill)"/>

  <text x="640" y="150" text-anchor="middle"
        font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">ByteWise <tspan fill="url(#waveText)">Voice</tspan></text>
  <text x="640" y="206" text-anchor="middle"
        font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" fill="#A5B4CF">Private, unlimited AI voice studio on your own Mac or PC</text>

